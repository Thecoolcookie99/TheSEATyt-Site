<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B2 File Manager</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>

<body>
  <div class="wrap">
    <div class="card compact-card">
      <div class="row">
        <input type="file" id="fileInput" />
        <button id="uploadBtn">Upload</button>
        <button id="refreshBtn" class="secondary">Refresh</button>
      </div>
      <div id="uploadStatus" class="status"></div>
      <div id="uploadProgressWrap" class="progress-wrap" hidden>
        <div class="progress-label">
          <span id="uploadProgressText">Preparing upload…</span>
          <span id="uploadProgressPercent">0%</span>
        </div>
        <div class="progress-bar">
          <div id="uploadProgressFill" class="progress-fill"></div>
        </div>
      </div>
      <div id="downloadProgressWrap" class="progress-wrap" hidden>
        <div class="progress-label">
          <span id="downloadProgressText">Preparing download…</span>
          <span id="downloadProgressPercent">0%</span>
        </div>
        <div class="progress-bar">
          <div id="downloadProgressFill" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div id="pathBar" class="pathBar" aria-hidden="false">
        <div class="row" style="align-items:center; gap:8px; margin-bottom:8px">
          <button id="upBtn" class="secondary" title="Go up one folder">Up</button>
          <button id="rootBtn" class="secondary" title="Go to root">Root</button>
          <div id="pathName" class="small" style="margin-left:8px;">/</div>
        </div>
      </div>

      <div id="files" class="list"></div>
    </div>
  </div>

  <!-- IMPORTANT: prevent duplicate loading issues -->
  <script>
    if (window.__B2_APP_LOADED__) {
      console.warn("script already loaded once — preventing duplicate execution");
    }
    window.__B2_APP_LOADED__ = true;
  </script>

  <script src="script.js?v=2"></script>
</body>
</html>
