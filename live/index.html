<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YouTube video player</title>
<style>
  :root { --bg: #000; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<iframe width="100%" height="100%" src="https://www.youtube.com/embed/HgWz05AsLxw?si=D_qufvostHYK9sYl" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
